<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0f1e;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 600px;
            height: 85vh;
            background: #0d1526;
            border-radius: 16px;
            border: 1px solid #00c8ff33;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #00c8ff33;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h2 {
            color: #00c8ff;
            font-size: 1.2rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #00c8ff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #chatbox {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #chatbox::-webkit-scrollbar { width: 4px; }
        #chatbox::-webkit-scrollbar-thumb { background: #00c8ff44; border-radius: 4px; }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .user-msg {
            background: #00c8ff22;
            border: 1px solid #00c8ff44;
            color: #00c8ff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: #ffffff0f;
            border: 1px solid #ffffff15;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #00c8ff22;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #ffffff0f;
            border: 1px solid #00c8ff33;
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus { border-color: #00c8ff; }
        input::placeholder { color: #ffffff44; }

        button {
            background: #00c8ff;
            color: #0a0f1e;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.85; }

        .typing {
            color: #00c8ff88;
            font-size: 0.8rem;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="dot"></div>
            <h2>🤖Hello, I'm Baymax </h2>
        </div>

        <div id="chatbox"></div>
        <div class="typing" id="typing"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send ➤</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatbox = document.getElementById("chatbox");
            const typing = document.getElementById("typing");
            const userText = input.value.trim();
            if (!userText) return;

            chatbox.innerHTML += `<div class="message user-msg">${userText}</div>`;
            input.value = "";
            typing.textContent = "AI is thinking...";
            chatbox.scrollTop = chatbox.scrollHeight;

            const response = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: userText})
            });

            const data = await response.json();
            typing.textContent = "";
            chatbox.innerHTML += `<div class="message ai-msg">${data.reply}</div>`;
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        document.getElementById("userInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
